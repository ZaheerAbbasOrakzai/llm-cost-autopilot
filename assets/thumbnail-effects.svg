<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b0f"/><stop offset="1" stop-color="#12141c"/>
    </linearGradient>
    <radialGradient id="glare" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- TiltCard with glare -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="180" height="100" rx="14" fill="#12141c" stroke="#4f46e5" stroke-width="3" opacity="0.9"/>
    <rect x="0" y="0" width="180" height="100" rx="14" fill="url(#glare)"/>
    <text x="90" y="28" text-anchor="middle" font-family="Inter" font-size="12" fill="#9ca3af">TiltCard</text>
    <text x="90" y="55" text-anchor="middle" font-family="Inter" font-size="18" font-weight="600" fill="#ffffff">3D Perspective</text>
    <text x="90" y="75" text-anchor="middle" font-family="Inter" font-size="11" fill="#9ca3af">Glare on hover</text>
  </g>

  <!-- HoloCard -->
  <g transform="translate(340, 140)">
    <defs>
      <linearGradient id="holoBorder" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8b5cf6"/>
        <stop offset="0.5" stop-color="#06b6d4"/>
        <stop offset="1" stop-color="#10b981"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="180" height="100" rx="14" fill="#12141c"/>
    <rect x="0" y="0" width="180" height="100" rx="14" fill="none" stroke="url(#holoBorder)" stroke-width="2" opacity="0.7"/>
    <text x="90" y="28" text-anchor="middle" font-family="Inter" font-size="12" fill="#9ca3af">HoloCard</text>
    <text x="90" y="55" text-anchor="middle" font-family="Inter" font-size="18" font-weight="600" fill="#ffffff">Holographic</text>
    <text x="90" y="75" text-anchor="middle" font-family="Inter" font-size="11" fill="#9ca3af">Animated border</text>
  </g>

  <!-- Cursor particles -->
  <g transform="translate(60, 285)">
    <rect x="0" y="0" width="520" height="60" rx="10" fill="#12141c" stroke="#2d3748" stroke-width="1" opacity="0.6"/>
    <text x="10" y="18" font-family="Inter" font-size="11" fill="#9ca3af">Cursor Particle System</text>
    <g fill="#8b5cf6" opacity="0.5">
      <circle cx="90" cy="35" r="3"/><circle cx="105" cy="33" r="2"/>
      <circle cx="120" cy="37" r="2"/><circle cx="135" cy="31" r="3"/>
      <circle cx="150" cy="38" r="2"/><circle cx="165" cy="34" r="1"/>
      <circle cx="180" cy="37" r="2"/><circle cx="195" cy="32" r="3"/>
      <circle cx="210" cy="36" r="2"/><circle cx="225" cy="35" r="1"/>
      <circle cx="240" cy="38" r="2"/><circle cx="255" cy="33" r="3"/>
      <circle cx="270" cy="37" r="2"/><circle cx="285" cy="34" r="1"/>
      <circle cx="300" cy="37" r="2"/><circle cx="315" cy="36" r="3"/>
    </g>
    <g fill="#06b6d4" opacity="0.4">
      <circle cx="170" cy="40" r="2"/><circle cx="230" cy="38" r="2"/>
    </g>
  </g>

  <!-- Number counters -->
  <g transform="translate(60, 50)" font-family="Inter" font-size="12">
    <text x="0" y="0" fill="#9ca3af">Budget: </text><text x="70" y="0" font-weight="700" fill="#10b981">$4,500</text>
    <text x="0" y="18" fill="#9ca3af">Savings: </text><text x="70" y="18" font-weight="700" fill="#8b5cf6">$1,247</text>
    <text x="0" y="36" fill="#9ca3af">ROI: </text><text x="70" y="36" font-weight="700" fill="#f59e0b">27.8%</text>
  </g>

  <text x="320" y="345" text-anchor="middle" font-family="Inter" font-size="14" font-weight="600" fill="#ffffff">3D Effects & Micro-interactions</text>
</svg>