<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b0f"/>
      <stop offset="1" stop-color="#12141c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Central icosahedron (stylized) -->
  <g transform="translate(320,180)">
    <!-- Glow halo -->
    <circle cx="0" cy="0" r="52" fill="url(#glow)" filter="blur(8px)"/>
    <!-- Icosahedron wireframe -->
    <g stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.8">
      <polygon points="0,-48 42,-15 26,40 -26,40 -42,-15"/>
      <polygon points="0,-48 -42,-15 -26,40 26,40" transform="rotate(35)" opacity="0.5"/>
      <polygon points="0,-48 42,-15 -26,40 -26,40" transform="rotate(-35)" opacity="0.5"/>
      <polygon points="0,48 42,15 26,-40 -26,-40" transform="rotate(180)" opacity="0.5"/>
    </g>
    <!-- Distortion shimmer -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 3" opacity="0.3" transform="rotate(15)"/>
  </g>

  <!-- Orbiting rings -->
  <g stroke="#8b5cf6" stroke-width="1" fill="none" opacity="0.4">
    <ellipse cx="320" cy="180" rx="120" ry="8" transform="rotate(15 320 180)"/>
    <ellipse cx="320" cy="180" rx="100" ry="6" transform="rotate(45 320 180)" opacity="0.3"/>
    <ellipse cx="320" cy="180" rx="140" ry="10" transform="rotate(-20 320 180)" opacity="0.2"/>
  </g>

  <!-- Data particles -->
  <g fill="#8b5cf6" opacity="0.6">
    <circle cx="260" cy="120" r="1.5"/>
    <circle cx="380" cy="140" r="1.2"/>
    <circle cx="300" cy="280" r="1"/>
    <circle cx="360" cy="220" r="1.3"/>
    <circle cx="220" cy="200" r="1.1"/>
    <circle cx="400" cy="180" r="0.8"/>
    <circle cx="340" cy="100" r="1"/>
    <circle cx="180" cy="160" r="0.9"/>
    <circle cx="420" cy="260" r="1.2"/>
    <circle cx="290" cy="310" r="0.7"/>
  </g>

  <!-- Cyan accent particles -->
  <g fill="#06b6d4" opacity="0.4">
    <circle cx="310" cy="90" r="1"/>
    <circle cx="370" cy="250" r="0.8"/>
    <circle cx="240" cy="240" r="0.9"/>
  </g>

  <!-- Overlay gradient -->
  <defs>
    <linearGradient id="overlayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b0f" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0b0f" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect x="0" y="280" width="640" height="80" fill="url(#overlayGrad)"/>

  <!-- Title -->
  <text x="320" y="320" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" fill="#ffffff">3D Hero Scene</text>
  <text x="320" y="342" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#9ca3af">Animated Icosahedron · Particle Cloud · Orbiting Rings</text>
</svg>